<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>明治学院大学写真部 機材係</title>

    <style>

        body {
            margin: 0;
            font-family: "Yu Gothic", sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px 8%;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        section {
            background: white;
            padding: 35px;
            margin-bottom: 30px;
            border-radius: 16px;
        }

        /* ここが横並びの設定 */
        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            flex: 1;
            background: #f8fafc;
            border: 2px solid #dbe2ea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .icon {
            font-size: 45px;
        }

        .card h3 {
            font-size: 21px;
        }

        .card p {
            color: #666;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

    </style>

</head>


<body>

<header>
    <h1>明治学院大学写真部</h1>
    <p>機材貸出サイト</p>
</header>


<main>

<section>

    <h2>機材を利用する</h2>

    <p>
        撮影機材の予約や空き状況を確認できます。
    </p>


    <div class="cards">

        <div class="card">
            <div class="icon">📷</div>
            <h3>機材一覧</h3>
            <p>利用できる撮影機材を確認できます。</p>
            <a href="equipment.html"><button>機材を見る</button></a>
        </div><div class="card">
            <div class="icon">📅</div>
            <h3>空き状況</h3>
            <p>機材の予約状況を確認できます。</p>
           <a href="availability.html"><button>空き状況を見る</button></a>
        </div><div class="card">
            <div class="icon">📝</div>
            <h3>機材を予約</h3>
            <p>使用したい機材を予約できます。</p>
           <a href="reservation.html"><button>予約する</button></a>
        </div>

    </div>

</section>


<section>

    <h2>お知らせ</h2>

    <ul>
        <li>3年生の引退時期はレンタルは不可能となります。※詳しくは別途連絡します。</li>
        <li>機材返却時は所定の場所へ戻してください。</li>
        <li>返却時はSDカード、レンズキャップ等もお確かめください。</li>
    </ul>

</section>


<section>

    <h2>お問い合わせ</h2>

    <p>
        機材係へのお問い合わせは、機材係の個人LINE等へお願いします。
    </p>

</section>

</main>


<footer>
    明治学院大学写真部機材係
</footer>

</html>
